<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Wrath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --line: rgba(255,255,255,0.14);
    --text: #f4f4f4;
    --dim: #8a8a8a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    position: relative;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* subtle grid */
  body::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: 0.25;
    mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
  }

  /* orbiting rings */
  .ring {
    position: absolute;
    top: 50%; left: 50%;
    border: 1px solid var(--line);
    border-radius: 50%;
    pointer-events: none;
  }
  .ring.a { width: 520px; height: 520px; margin: -260px 0 0 -260px; animation: spin 40s linear infinite; }
  .ring.b { width: 780px; height: 780px; margin: -390px 0 0 -390px; animation: spin 70s linear infinite reverse; border-style: dashed; opacity: 0.6; }
  .ring.a::after {
    content: "";
    position: absolute; top: -4px; left: 50%;
    width: 8px; height: 8px; margin-left: -4px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 0 14px #fff;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }

  /* soft glow */
  .glow {
    position: absolute; top: 50%; left: 50%;
    width: 480px; height: 480px; margin: -240px 0 0 -240px;
    background: radial-gradient(circle, rgba(255,255,255,0.10), transparent 65%);
    filter: blur(40px);
    pointer-events: none;
  }

  main {
    position: relative; z-index: 1;
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px; text-align: center; padding: 0 20px;
  }

  h1 {
    margin: 0;
    font-weight: 700;
    font-size: clamp(3.2rem, 14vw, 8rem);
    letter-spacing: 0.08em;
    line-height: 1;
  }
  h1 span { color: transparent; -webkit-text-stroke: 1.5px var(--text); }

  a.download {
    font-weight: 700;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    color: #080808;
    background: var(--text);
    text-decoration: none;
    padding: 0.7em 1.6em;
    border-radius: 10px;
    border: 1px solid var(--text);
    transition: background .2s ease, color .2s ease, transform .15s ease;
  }
  a.download:hover { background: transparent; color: var(--text); transform: translateY(-2px); }

  .tagline {
    font-size: 0.9rem;
    color: var(--dim);
    padding: 0.5em 1em;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>

<div class="glow"></div>
<div class="ring a"></div>
<div class="ring b"></div>

<main>
  <h1>WR<span>A</span>TH</h1>
  <a class="download" href="#">Download Wrath</a>
  <div class="tagline">Free. Fast. Built different.</div>
  <div class="tagline">Get the Wrath loader above by clicking "Download Wrath"</div>
</main>

</body>
</html>
